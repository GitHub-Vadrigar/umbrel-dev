manifestVersion: 1
id: vadrigar-nerva
name: Nerva Node
tagline: Run your own Nerva node
icon: https://raw.githubusercontent.com/GitHub-Vadrigar/umbrel-apps/refs/heads/master/vadrigar-nerva/app/logo.png
category: crypto
version: "0.3.8a3"
port: 17578
description: >-
  Run your own Nerva node. Monitor sync status, peers and blocks.
  
  NERVA (XNV) is a privacy focused cryptocurrency built for secure transactions, private balances, and true financial fungibility. 
  Using proven Cryptonote privacy technology, NERVA obscures sender, receiver, and transaction amounts on chain. 
  This allows users to transact without exposing their financial history to the public.
  
  Features:
    - Dashboard for node, sync, peer and block stats.
    - Connect the NervaOne desktop wallet to your synced node.
    - Solo mine directly from your Umbrel server to earn XNV and to support the network.
    - Outgoing connections to Tor Peers integrated
  
  Notes:
    - Mining is very CPU intensive for your Umbrel server, take caution using this function.
    - Node sync can be slow on small or busy systems. SSD is recommended.
  
  Components:
    - Official Nerva Docker image from Docker Hub: https://hub.docker.com/r/sn1f3rt/nerva (v0.2.1.0)
    - Docker official images used: alpine, nginx and node

