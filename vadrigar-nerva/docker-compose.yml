services:
  web:
    image: ghcr.io/github-vadrigar/vadrigar-nerva-web:0.4.0-rc1
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}:/app_root
      - ${APP_DATA_DIR}/data/nerva:/data/nerva
      - /var/run/docker.sock:/var/run/docker.sock
  
  nervad:
    user: "1000:1000"
    restart: unless-stopped
    image: sn1f3rt/nerva:v0.3.0.0
    depends_on:
      - web
    ports:
      - "17565:17565"
      - "17566:17566"
    volumes:
      - ${APP_DATA_DIR}/data/nerva:/data/nerva
    entrypoint: ["/bin/sh", "-c", "while [ ! -f /data/nerva/start.sh ]; do sleep 1; done; exec /bin/sh /data/nerva/start.sh"]

  app_proxy:
    environment:
      APP_HOST: vadrigar-nerva_web_1
      APP_PORT: 80